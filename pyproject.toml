[project]
name = "rtrq-workspace"
version = "0.0.0"
description = "Workspace tooling for RTRQ Python packages and apps."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/server",
  "demos/fastapi-react/backend",
  "packages/python/client-core",
  "packages/python/server-core",
  "packages/python/server-sdk",
]

[tool.uv.sources]
rtrq-client-core = { workspace = true }
rtrq-server-core = { workspace = true }
rtrq-server-sdk = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
  "apps/server/tests",
  "demos/fastapi-react/backend/tests",
  "packages/python/client-core/tests",
  "packages/python/server-core/tests",
  "packages/python/server-sdk/tests",
]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
