[project]
name = "rtrq-demo-fastapi-react-backend"
version = "0.0.0"
description = "FastAPI backend scaffold for the RTRQ React demo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "rtrq-server-sdk",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
rtrq-demo-fastapi-react-backend = "rtrq_fastapi_react_demo.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtrq_fastapi_react_demo"]

[tool.uv.sources]
rtrq-server-sdk = { workspace = true }
