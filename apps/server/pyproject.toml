[project]
name = "rtrq-server"
version = "0.0.0"
description = "Self-hostable RTRQ FastAPI server scaffold."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "rtrq-server-core",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
rtrq-server = "rtrq_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtrq_server"]

[tool.uv.sources]
rtrq-server-core = { workspace = true }
