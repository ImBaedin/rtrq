[project]
name = "rtrq-server-sdk"
version = "0.0.0"
description = "Python backend SDK scaffold for sending RTRQ invalidations."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtrq_server_sdk"]
